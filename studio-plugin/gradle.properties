org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.stdlib.default.dependency=false
# The IntelliJ Platform plugin compiles with a JDK matching the IDE's runtime. install-plugin.mjs points this at
# Studio's bundled JBR; otherwise the foojay resolver (settings.gradle.kts) downloads a matching JDK.
org.gradle.java.installations.fromEnv=ANDROID_STUDIO_JBR
